<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>pi / monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #141414;
      color: #888;
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 14px;
      line-height: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem;
    }

    .page { width: 520px; }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 2.5rem;
    }

    .header-title { color: #f0f0f0; font-size: 13px; letter-spacing: 0.05em; }
    .header-title a { color: #555; text-decoration: none; }
    .header-title a:hover { color: #d4a84b; }

    .header-right { font-size: 12px; color: #444; display: flex; gap: 2rem; }

    .dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #d4a84b;
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }
    .dot.off { background: #333; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* STAT ROWS */
    .stat-row {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid #1e1e1e;
    }

    .stat-name {
      width: 80px;
      color: #444;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .stat-num {
      width: 70px;
      color: #f0f0f0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }

    .stat-num.warn { color: #c8813a; }
    .stat-num.crit { color: #b84444; }

    .stat-unit { font-size: 11px; color: #444; margin-left: 2px; }

    .bar {
      flex: 1;
      height: 2px;
      background: #222;
      max-width: 200px;
      flex-shrink: 0;
    }

    .bar-fill {
      height: 100%;
      background: #d4a84b;
      opacity: 0.5;
      transition: width 0.4s ease;
    }

    .bar-fill.warn { background: #c8813a; }
    .bar-fill.crit { background: #b84444; }

    .stat-detail { font-size: 11px; color: #444; }

    /* UPTIME */
    .uptime-row {
      padding: 1rem 0;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    .uptime-val { color: #f0f0f0; font-size: 16px; }

    /* SERVICES */
    .services-title {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #444;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    .service-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.6rem 0;
      border-bottom: 1px solid #1e1e1e;
    }

    .service-name { color: #888; font-size: 13px; }

    .service-up   { color: #d4a84b; font-size: 11px; }
    .service-down { color: #b84444; font-size: 11px; }

    /* FOOTER */
    .footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #333;
    }

    #error { display: none; font-size: 11px; color: #b84444; margin-bottom: 1rem; }
  </style>
</head>
<body>

<div class="page">
  <div class="header">
    <span class="header-title"><a href="/">haakon</a> / monitor</span>
    <div class="header-right">
      <span><span class="dot" id="dot"></span><span id="status">connecting...</span></span>
      <span id="updated">—</span>
    </div>
  </div>

  <div id="error">⚠ api unreachable — retrying</div>

  <div id="stats">
    <div class="stat-row">
      <span class="stat-name">CPU</span>
      <span class="stat-num" id="cpu-val">—<span class="stat-unit">%</span></span>
      <div class="bar"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
      <span class="stat-detail" id="cpu-detail"></span>
    </div>

    <div class="stat-row">
      <span class="stat-name">Memory</span>
      <span class="stat-num" id="ram-val">—<span class="stat-unit">%</span></span>
      <div class="bar"><div class="bar-fill" id="ram-bar" style="width:0%"></div></div>
      <span class="stat-detail" id="ram-detail"></span>
    </div>

    <div class="stat-row">
      <span class="stat-name">Temp</span>
      <span class="stat-num" id="temp-val">—<span class="stat-unit">°C</span></span>
      <div class="bar"><div class="bar-fill" id="temp-bar" style="width:0%"></div></div>
      <span class="stat-detail" id="temp-detail"></span>
    </div>

    <div class="stat-row">
      <span class="stat-name">Disk</span>
      <span class="stat-num" id="disk-val">—<span class="stat-unit">%</span></span>
      <div class="bar"><div class="bar-fill" id="disk-bar" style="width:0%"></div></div>
      <span class="stat-detail" id="disk-detail"></span>
    </div>

    <div class="uptime-row">
      <span class="stat-name">Uptime</span>
      <span class="uptime-val" id="uptime-val">—</span>
    </div>

    <div class="uptime-row">
      <span class="stat-name">Network</span>
      <span class="uptime-val" id="net-val">—</span>
    </div>
  </div>

  <div class="services-title">Services</div>
  <div id="services"></div>

  <div class="footer">
    <span>raspberry pi 4 · 8gb</span>
    <span id="clock">—</span>
  </div>

<script>
  function colorClass(v, warn, crit) {
    return v >= crit ? 'crit' : v >= warn ? 'warn' : '';
  }

  function setNum(id, text, c) {
    const el = document.getElementById(id);
    const unit = el.querySelector('.stat-unit');
    el.className = 'stat-num' + (c ? ' ' + c : '');
    el.childNodes[0].textContent = text;
    if (unit) el.appendChild(unit);
  }

  function setBar(id, pct, c) {
    const el = document.getElementById(id);
    el.style.width = Math.min(pct, 100) + '%';
    el.className = 'bar-fill' + (c ? ' ' + c : '');
  }

  async function fetchStats() {
    try {
      const d = await fetch('/api/stats').then(r => { if (!r.ok) throw 0; return r.json(); });

      document.getElementById('error').style.display = 'none';
      document.getElementById('status').textContent = 'live';
      document.getElementById('dot').className = 'dot';

      const cc = colorClass(d.cpu.percent, 70, 90);
      setNum('cpu-val', d.cpu.percent.toFixed(1), cc);
      setBar('cpu-bar', d.cpu.percent, cc);
      document.getElementById('cpu-detail').textContent = `${d.cpu.count} cores · ${d.cpu.freq} MHz`;

      const rc = colorClass(d.ram.percent, 75, 90);
      setNum('ram-val', d.ram.percent.toFixed(1), rc);
      setBar('ram-bar', d.ram.percent, rc);
      document.getElementById('ram-detail').textContent = `${d.ram.used_gb} / ${d.ram.total_gb} GB`;

      if (d.temp !== null) {
        const tc = colorClass(d.temp, 70, 80);
        setNum('temp-val', d.temp, tc);
        setBar('temp-bar', (d.temp / 90) * 100, tc);
        document.getElementById('temp-detail').textContent = d.temp >= 70 ? 'hot' : 'ok';
      }

      const dc = colorClass(d.disk.percent, 80, 90);
      setNum('disk-val', d.disk.percent.toFixed(1), dc);
      setBar('disk-bar', d.disk.percent, dc);
      document.getElementById('disk-detail').textContent = `${d.disk.used_gb} / ${d.disk.total_gb} GB`;

      document.getElementById('uptime-val').textContent = d.uptime;
      document.getElementById('net-val').textContent =
        `↓ ${d.net.recv_mb.toLocaleString()} MB  ·  ↑ ${d.net.sent_mb.toLocaleString()} MB`;

      document.getElementById('services').innerHTML = Object.entries(d.services).map(([name, up]) => `
        <div class="service-row">
          <span class="service-name">${name}</span>
          <span class="${up ? 'service-up' : 'service-down'}">${up ? 'running' : 'stopped'}</span>
        </div>`).join('');

      document.getElementById('updated').textContent =
        new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    } catch {
      document.getElementById('error').style.display = 'block';
      document.getElementById('status').textContent = 'offline';
      document.getElementById('dot').className = 'dot off';
    }
  }

  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  fetchStats();
  setInterval(fetchStats, 3000);
  tick();
  setInterval(tick, 1000);
</script>
</div>
</body>
</html>
